name: CI

# Roda em todo PR e em todo push para main. Até aqui nada validava mudança
# nenhuma: lint, tipos, testes e build só aconteciam se alguém lembrasse de
# rodar na própria máquina, e o resultado não ficava registrado em lugar nenhum.

on:
  pull_request:
  push:
    branches: [main]

# Um PR que recebe vários pushes seguidos cancela as execuções antigas —
# só o último commit interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    # O build não precisa de credenciais reais: todas as rotas são
    # `force-dynamic`, então nenhuma consulta o Supabase em tempo de build.
    # Valores falsos só evitam que `createClient` estoure na carga do módulo.
    # Se um dia alguma página passar a ser pré-renderizada, este job passa a
    # falhar — e é o aviso certo, porque aí o build vira dependente de dados.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-falsa-de-ci
      SUPABASE_SERVICE_ROLE_KEY: chave-falsa-de-ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: falha se o pnpm-lock.yaml estiver fora de sincronia
      # com o package.json, em vez de resolver silenciosamente outra versão.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Os passos seguem mesmo se o lint falhar: um PR deve mostrar todos os
      # problemas de uma vez, não um por execução.
      - name: Tipos
        if: '!cancelled()'
        run: pnpm exec tsc --noEmit

      - name: Testes
        if: '!cancelled()'
        run: pnpm test

      - name: Build
        if: '!cancelled()'
        run: pnpm build

  database:
    name: Migrações e reconciliação
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compara_suple_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compara_suple_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: compara_suple_test

    steps:
      - uses: actions/checkout@v4

      - name: Criar papéis do Supabase
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          SQL

      - name: Aplicar migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Testar reconciliação e simulação
        run: |
          for test_file in supabase/tests/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$test_file"
          done

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest

    # O app sobe contra o stub de dados de `e2e/stub-supabase.ts`, nunca contra
    # o Supabase real: asserções sobre contagem de produtos não podem depender
    # do catálogo do dia. O schema e o SQL de verdade são cobertos pelo job
    # `database`; aqui o que se cobre é navegação e renderização.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-de-teste-sem-valor
      SUPABASE_SERVICE_ROLE_KEY: chave-de-teste-sem-valor

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Só chromium: um navegador pega regressão de navegação e layout sem
      # triplicar o tempo do job.
      - name: Instalar navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        run: pnpm test:e2e

      # O relatório só interessa quando algo falhou.
      - name: Guardar relatório da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
